services:
  mongodb:
    image: mongo:7.0
    container_name: sentinel-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - sentinel-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sentinel-ai-service
    restart: always
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:8b
    networks:
      - sentinel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - SERVER_PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/sentinel_soc
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=production
    depends_on:
      - mongodb
      - ai-service
    networks:
      - sentinel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_PROXY_TARGET=http://backend:5000
    container_name: sentinel-frontend
    restart: always
    ports:
      - '5173:5173'
    depends_on:
      - backend
    networks:
      - sentinel-net

volumes:
  mongo_data:

networks:
  sentinel-net:
    driver: bridge
